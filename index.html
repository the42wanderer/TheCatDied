<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cactus Cataclysm Prototype</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="hud">
        <h1>🌵 Cactus Cataclysm</h1>
        <p>WASD/Arrows: move • Mouse: aim • Click/Space: shoot • Shift: dash</p>
        <p id="stats"></p>
      </section>
      <canvas id="game" width="960" height="540" aria-label="game canvas"></canvas>
      <section class="panel" id="panel"></section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
